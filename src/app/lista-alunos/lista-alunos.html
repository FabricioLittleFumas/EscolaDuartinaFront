<p-table [value]="alunos" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template #header>
                <tr>
                    <th>Nome</th>
                    <th>Unidade</th>
                  
                </tr>
            </ng-template>
            <ng-template #body let-aluno>
                <tr>
                    <td>{{ aluno.nome }}</td>
                    <td>{{ aluno.unidade }}</td>
                    
                </tr>
            </ng-template>
        </p-table>
