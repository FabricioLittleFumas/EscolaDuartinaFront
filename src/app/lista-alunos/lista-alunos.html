<h1 class="titulo">Lista de Alunos</h1>
<p-table styleClass="p-datatable-striped"  [value]="alunos" >
            <ng-template #header>
                <tr>
                    <th>Nome</th>
                     <th>Data de nascimento</th>
                    <th>Unidade</th>
                     <th>Inserir</th>
                     <th>Visualizar</th>
                  <th>Editar</th>
                  <th>Excluir</th>
                </tr>
            </ng-template>
            <ng-template #body let-aluno>
                <tr>
                    <td>{{ aluno.nome }}</td>
                    <td>{{ aluno.data_saida | date:'dd/MM/yy'}}</td>
                     <td>{{ aluno.unidade }}</td>
                     <td><span class="pi pi-search" (click)="modalInsertAluno.showDialog(aluno)"></span>
                  
                    </td>
                     <td><span class="pi pi-eye" (click)="modalViewAluno.showDialog(aluno)"></span>
                        <app-modal-view-aluno #modalViewAluno [aluno]="aluno"></app-modal-view-aluno>
                    </td>
                        <td><span class="pi pi-search"(click)="modalEditAluno.showDialog(aluno)"></span>
                        </td>
                        <td><span class="pi pi-trash" (click)="modalExcludeAluno.showDialog(aluno)"> </span>
                            <app-modal-exclude-aluno #modalExcludeAluno [alunoExclude]="aluno" (confirm)="excluir($event)"></app-modal-exclude-aluno>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            <app-modal-insert-aluno #modalInsertAluno (insertAluno)="insertAluno($event)" ></app-modal-insert-aluno>
            <app-modal-edit-aluno #modalEditAluno (emitAlunoAtt)="emitAlunoAtt($event)"></app-modal-edit-aluno>
