<h1 class="titulo">Lista de Alunos</h1>
<p-table styleClass="p-datatable-striped"  [value]="alunos" >
            <ng-template #header>
                <tr>
                    <th>Nome</th>
                    
                    <th>Unidade</th>
                     <th>Visualizar</th>
                  <th>Editar</th>
                  <th>Excluir</th>
                </tr>
            </ng-template>
            <ng-template #body let-aluno>
                <tr>
                    <td>{{ aluno.nome }}</td>
                   
                     <td>{{ aluno.unidade }}</td>
                     <td><span class="pi pi-eye"></span></td>
                        <td><span class="pi pi-search"></span></td>
                     <td><span class="pi pi-trash"></span></td>
                </tr>
            </ng-template>
        </p-table>
