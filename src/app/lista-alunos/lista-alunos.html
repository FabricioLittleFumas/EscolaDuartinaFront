<h1 class="titulo">Lista de Alunos</h1>
<!-- <p-table styleClass="p-datatable-striped"  [value]="alunos" > -->
   <div class="tabela-wrapper">
   <ngx-loading
    [show]="(loading$ | async) ?? false"
    [config]="{ fullScreenBackdrop: false, backdropBackgroundColour: 'rgba(255, 255, 255, 0.72)', primaryColour: '#b884b7', secondaryColour: '#d0c3d3', tertiaryColour: '#b884b7' }">
   </ngx-loading>
   <p-table 
  styleClass="p-datatable-striped" 
  [value]="alunos"
  [lazy]="true"
  [first]="first"
  [paginator]="true"
  [rows]="pageSize"
  [totalRecords]="totalRecords"
  (onLazyLoad)="onLazyLoad($event)"
  [rowsPerPageOptions]="[5, 10, 20, 50]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} alunos"
  [tableStyle]="{ 'min-width': '50rem' }"
  [tableStyle]="{ 'min-width': '700px' }"
>
            <ng-template #header>
                <tr>
                    <th pSortableColumn="nome">Nome <p-sort-icon field="nome" /></th>
                     <th pSortableColumn="data_saida">Data de matrícula <p-sort-icon field="data_saida" /></th>
                    <th pSortableColumn="unidade">Unidade <p-sort-icon field="unidade" /></th>
                     <th *ngIf="hasAutority">Inserir</th>
                     <th>Visualizar</th>
                  <th *ngIf="hasAutority">Editar</th>
                  <th *ngIf="hasAutority">Excluir</th>
                </tr>
            </ng-template>
            <ng-template #body let-aluno>
                <tr>
                    <td>{{ aluno.nome }}</td>
                    <td>{{ aluno.data_saida | date:'dd/MM/yyyy'}}</td>
                     <td>{{ aluno.unidade }}</td>
                     <td *ngIf="hasAutority">
                      <button pButton type="button" severity="secondary" class="acao-aluno" (click)="modalInsertAluno.showDialog(aluno)" [attr.aria-label]="'Abrir ações de ' + aluno.nome">
                        <i class="pi pi-search" aria-hidden="true"></i>
                      </button>
                    </td>
                     <td>
                      <button pButton type="button" severity="secondary" class="acao-aluno" (click)="modalViewAluno.showDialog(aluno)" [attr.aria-label]="'Visualizar ' + aluno.nome">
                        <i class="pi pi-eye" aria-hidden="true"></i>
                      </button>
                        <app-modal-view-aluno #modalViewAluno [aluno]="aluno"></app-modal-view-aluno>
                    </td>
                        <td *ngIf="hasAutority">
                          <button pButton type="button" severity="secondary" class="acao-aluno" (click)="modalEditAluno.showDialog(aluno)" [attr.aria-label]="'Editar ' + aluno.nome">
                            <i class="pi pi-pencil" aria-hidden="true"></i>
                          </button>
                        </td>
                        <td *ngIf="hasAutority">
                          <button pButton type="button" severity="secondary" class="acao-aluno" (click)="modalExcludeAluno.showDialog(aluno)" [attr.aria-label]="'Excluir ' + aluno.nome">
                            <i class="pi pi-trash" aria-hidden="true"></i>
                          </button>
                            <app-modal-exclude-aluno #modalExcludeAluno [alunoExclude]="aluno" (confirm)="excluir($event)"></app-modal-exclude-aluno>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            </div>
            <app-modal-insert-aluno #modalInsertAluno (insertAluno)="insertAluno($event)" ></app-modal-insert-aluno>
            <app-modal-edit-aluno #modalEditAluno (emitAlunoAtt)="emitAlunoAtt($event)"></app-modal-edit-aluno>

        
        <p-toast />
