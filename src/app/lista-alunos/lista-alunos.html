<h1 class="titulo">Lista de Alunos</h1>
<p-table styleClass="p-datatable-striped"  [value]="alunos" [tableStyle]="{ 'min-width': '50rem' }" >
            <ng-template #header>
                <tr>
                    <th>Nome</th>
                     <th>Data de nascimento</th>
                    <th>Unidade</th>
                  <th>Editar</th>
                  <th>Excluir</th>
                </tr>
            </ng-template>
            <ng-template #body let-aluno>
                <tr>
                    <td>{{ aluno.nome }}</td>
                    <td>{{ aluno.data | date:'dd/MM/yyyy'}}</td>
                     <td>{{ aluno.unidade }}</td>
                        <td>{{ aluno.data | date:'dd/MM/yyyy'}}</td>
                     <td>{{ aluno.unidade }}</td>
                </tr>
            </ng-template>
        </p-table>
