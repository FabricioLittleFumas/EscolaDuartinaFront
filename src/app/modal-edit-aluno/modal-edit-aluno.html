<form [formGroup]="alunoForms" (ngSubmit)="onSubmit()" class="mt-4">
<p-dialog 
header="Editar" 
[(visible)]="displayModal" 
[modal]="true"
[dismissableMask]="!salvando"
[closable]="!salvando"
[style]="{ width: '450px' }"
(onHide)="closeDialog()">

      <div class="p-fluid">
        <div>
          <label for="rm" class="font-bold lbInfo">RM</label>
          <input id="rm" class="ipInfo" type="number" min="1" step="1" pInputText formControlName="rm" placeholder="Digite o RM do aluno" />
          <small class="erro-campo" *ngIf="alunoForms.controls['rm'].touched && alunoForms.controls['rm'].invalid">Informe um RM maior que zero.</small>
        </div>
        <div>
          <label for="nome" class="font-bold lbInfo">Nome</label>
          <input id="nome" class="ipInfo" type="text" pInputText 
          placeholder="Digite o nome completo" formControlName="nome" />
          <small class="erro-campo" *ngIf="alunoForms.controls['nome'].touched && alunoForms.controls['nome'].invalid">Informe um nome com pelo menos 3 caracteres.</small>
        </div>
        
        <div>
          <label for="data_nascimento" class="font-bold lbInfo">Data de nascimento</label>
         
           <p-datepicker 
    inputId="data_nascimento"
    formControlName="data_nascimento" 
    dateFormat="dd/mm/yy" 
    panelStyleClass="calendario-compacto">
  </p-datepicker>
        </div>

        <div>
          <label for="unidade" class="font-bold lbInfo">Unidade</label>
          <input id="unidade" class="ipInfo" type="text" pInputText 
          placeholder="Digite a unidade escolar" formControlName="unidade" />
          <small class="erro-campo" *ngIf="alunoForms.controls['unidade'].touched && alunoForms.controls['unidade'].invalid">Informe a unidade escolar.</small>
         
        </div>
        <div class="flx">
            <button pButton type="submit" [disabled]="salvando">{{ salvando ? 'Salvando...' : 'Salvar alterações' }}</button>
            <button pButton severity="secondary" type="button" (click)="closeDialog()" [disabled]="salvando">Cancelar</button>
        </div>
        <p class="erro-formulario" *ngIf="erro" role="alert">{{ erro }}</p>
      </div>
    </p-dialog>
    </form>
