<form [formGroup]="alunoForms" (ngSubmit)="onSubmit()" class="mt-4">
<p-dialog 
header="Editar" 
[(visible)]="displayModal" 
[modal]="true"
[dismissableMask]="true"
[closable]="true"
[style]="{ width: '450px' }"
(onHide)="closeDialog()">

      <div class="p-fluid">
        <div>
          <label for="nome" class="font-bold lbInfo">Nome</label>
          <input id="nome" class="ipInfo" type="text" pInputText 
          [(ngModel)]="aluno.nome" placeholder="Digite seu nome" formControlName="nome" />
        </div>
        
        <div>
          <label for="DtNasc" class="font-bold lbInfo">Data de nascimento</label>
         
           <p-datepicker 
    formControlName="data_saida" 
    dateFormat="dd/mm/yy" 
    panelStyleClass="calendario-compacto">
  </p-datepicker>
        </div>

        <div>
          <label for="unidade" class="font-bold lbInfo">Unidade</label>
          <input id="unidade" class="ipInfo" type="text" pInputText 
          [(ngModel)]="aluno.unidade" placeholder="Digite sua unidade Escolar" formControlName="unidade" />
         
        </div>
        <div class="flx">
            <button pButton severity="secondary" type="submit">Atualizar</button>
            <button  type="reset" (click)="closeDialog()">Cancelar</button>
        </div>
      </div>
    </p-dialog>
    </form>
