<p-menubar [model]="items">
            <ng-template #start >
            </ng-template>
           
            <ng-template #end>
                <div class="flex items-center gap-2">
                    <input type="text" pInputText placeholder="Pesquisar" class="w-36" />
                    <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
                     shape="circle"  (click)="modalEntrar.showDialog()" />
                </div>
            </ng-template>
        </p-menubar>
 <app-modal-entrar 
      #modalEntrar
      (confirm)="onLoginConfirm($event)" 
      (cancel)="onLoginCancel()">
    </app-modal-entrar>
 <app-modal-cadastro 
      #modalCadastro
      (confirm)="onLoginConfirm($event)" 
      (cancel)="onLoginCancel()">
    </app-modal-cadastro>
