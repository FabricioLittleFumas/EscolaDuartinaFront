<p-menubar [model]="items">
            <ng-template #start>
                <a class="marca-escola" routerLink="/home" aria-label="EMEF José Sabbag, início">
                    <span class="marca-icone" aria-hidden="true"><i class="pi pi-book"></i></span>
                    <span class="marca-texto"><strong>EMEF José Sabbag</strong><small>Duartina · São Paulo</small></span>
                </a>
            </ng-template>
           
            <ng-template #end>
        
                <div class="flex items-center gap-2">
                    <input (ngModelChange)="onBuscar($event)" type="text" [(ngModel)]="termoBusca" pInputText placeholder="Pesquisar" class="w-36" />
                    <p-avatar label="ED" shape="circle" aria-label="Abrir acesso à conta"
                     (click)="modalEntrar.showDialog()" />
                </div>
           
            </ng-template>
        </p-menubar>
 <app-modal-entrar 
      #modalEntrar
      (confirm)="onLoginConfirm($event)" 
      (cancel)="onLoginCancel()">
    </app-modal-entrar>
 <app-modal-cadastro 
      #modalCadastro
      (confirm)="onLoginConfirmCadastro($event)" 
      (cancel)="onLoginCancel()">
</app-modal-cadastro>
   <p-toast />
    <app-modal-insert-aluno #modalInsertAluno (insertAluno)="insertAluno($event)" ></app-modal-insert-aluno>
