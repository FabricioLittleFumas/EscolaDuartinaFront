<p-dialog 
      header="Entrar" 
      [(visible)]="displayModal" 
      [modal]="true"
      [dismissableMask]="true"
      [closable]="true"
      [style]="{ width: '450px' }"
      (onHide)="closeDialog()">
      
      <div class="p-fluid">
        <div class="field">
          <label for="email" class="font-bold lbInfo">Email</label>
          <input id="email" class="ipInfo" type="email" pInputText [(ngModel)]="email" placeholder="Digite seu email" />
        </div>
        
        <div class="field">
          <label for="senha" class="font-bold lbInfo">Senha</label>
          <input id="senha" class="ipInfo" type="password" pInputText [(ngModel)]="password" placeholder="Digite sua senha" />
         <button> Entrar </button>
        </div>
      </div>
      
      <!-- Footer com botões -->
      <ng-template pTemplate="footer">
        <p-button label="Cancelar" icon="pi pi-times" (click)="closeDialog()" class="p-button-text"></p-button>
        <p-button label="Confirmar" icon="pi pi-check" (click)="confirmDialog()" class="p-button-success"></p-button>
    
      </ng-template>
    </p-dialog>
