<form [formGroup]="loginForm" (ngSubmit)="confirmDialog()" class="mt-4">
<p-dialog 
      header="Entrar" 
      [(visible)]="displayModal" 
      [modal]="true"
      [dismissableMask]="!salvando"
      [closable]="!salvando"
      styleClass="modal-padrao"
      [style]="{ width: '450px' }"
      (onHide)="closeDialog()">
      
      <div class="p-fluid">
        <div class="field">
          <label for="email" class="font-bold lbInfo">Email</label>
          <input formControlName="email" id="email" class="ipInfo" type="email" pInputText placeholder="Digite seu e-mail" autocomplete="username" />
          <small class="erro-campo" *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].invalid">Informe um e-mail válido.</small>
        </div>
        
        <div class="field">
          <label for="senha" class="font-bold lbInfo">Senha</label>
          <input formControlName="password" id="password" class="ipInfo" type="password" pInputText placeholder="Digite sua senha" autocomplete="current-password" />
          <small class="erro-campo" *ngIf="loginForm.controls['password'].touched && loginForm.controls['password'].invalid">Informe sua senha.</small>
        </div>
        <p class="login-progresso" *ngIf="salvando" role="status" aria-live="polite">
          Conferindo seus dados com o servidor. Isso pode levar alguns segundos.
        </p>
        <p class="erro-formulario" *ngIf="erro" role="alert">{{ erro }}</p>
        <div class="acoes-formulario">
          <button pButton type="submit" [disabled]="salvando">
            <i *ngIf="salvando" class="pi pi-spin pi-spinner" aria-hidden="true"></i>
            {{ salvando ? 'Conferindo acesso...' : 'Entrar' }}
          </button>
          <button pButton type="button" severity="secondary" (click)="closeDialog()" [disabled]="salvando">Cancelar</button>
        </div>
      </div>
    </p-dialog>    
  </form>
