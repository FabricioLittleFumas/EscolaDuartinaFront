<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-4">
<p-dialog 
      header="Entrar" 
      [(visible)]="displayModal" 
      [modal]="true"
      [dismissableMask]="true"
      [closable]="true"
      [style]="{ width: '450px' }"
      (onHide)="closeDialog()">
      
      <div class="p-fluid">
        <div class="field">
          <label for="email" class="font-bold lbInfo">Email</label>
          <input formControlName="email" id="email" class="ipInfo" type="email" pInputText [(ngModel)]="email" placeholder="Digite seu email" />
        </div>
        
        <div class="field">
          <label for="senha" class="font-bold lbInfo">Senha</label>
          <input formControlName="password" id="password" class="ipInfo" type="password" pInputText [(ngModel)]="password" placeholder="Digite sua senha" />
         <button (click)="confirmDialog()" > Entrar </button>
        </div>
      </div>
      
       <!-- Footer com botões -->
      <ng-template pTemplate="footer">
        <button label="Cancelar" icon="pi pi-times" (click)="closeDialog()" class="p-button-text"></button>
        <button label="Confirmar" icon="pi pi-check" (click)="confirmDialog()" class="p-button-success"></button>
      </ng-template>
    </p-dialog>    
  </form>
