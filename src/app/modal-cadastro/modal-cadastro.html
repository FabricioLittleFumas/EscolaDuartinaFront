<p-dialog 
      header="Cadastrar" 
      [(visible)]="displayModal" 
      [modal]="true" 
      [closable]="true"
      [dismissableMask]="true"
      [style]="{ width: '450px' }"
      (onHide)="closeDialog()">
      
      <div class="p-fluid">
        <div class="field mb-4">
          <label for="email" class="font-bold">Email</label>
          <input id="email" type="email" pInputText [(ngModel)]="email" placeholder="Digite seu email" />
        </div>
        
        <div class="field">
          <label for="senha" class="font-bold">Senha</label>
          <input id="senha" type="password" pInputText [(ngModel)]="senha" placeholder="Digite sua senha" />
          <button> Entrar </button>
        </div>
      </div>
      
      <!-- Footer com botões -->
      <ng-template pTemplate="footer">
        <p-button label="Cancelar" icon="pi pi-times" (click)="closeDialog()" class="p-button-text"></p-button>
        <p-button label="Confirmar" icon="pi pi-check" (click)="confirmDialog()" class="p-button-success"></p-button>
      </ng-template>
    </p-dialog>
