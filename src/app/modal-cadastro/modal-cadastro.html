<form [formGroup]="usuarioForm" (ngSubmit)="confirmDialog()" class="mt-4">
<p-dialog 
      header="Cadastrar" 
      [(visible)]="displayModal" 
      [modal]="true" 
      [closable]="true"
      [dismissableMask]="true"
      [style]="{ width: '450px' }"
      (onHide)="closeDialog()">
      
      <div class="p-fluid">
        <div class="field">
          <label for="name" class="font-bold lbInfo">Nome</label>
          <input formControlName="name" id="name"  class="ipInfo"type="name" pInputText [(ngModel)]="name" placeholder="Digite seu nome" />
        </div>
        <div class="field">
          <label for="email" class="font-bold lbInfo">Email</label>
          <input formControlName="email" id="email" class="ipInfo" type="email" pInputText [(ngModel)]="email" placeholder="Digite seu email" />
        </div>
        
        <div class="field">
          <label for="password" class="font-bold lbInfo">Senha</label>
          <input formControlName="password" id="password" class="ipInfo" type="password" pInputText [(ngModel)]="password" placeholder="Digite sua senha" />
        </div>
        <div class="acoes-formulario">
          <button pButton type="submit">Cadastrar</button>
          <button pButton type="button" severity="secondary" (click)="closeDialog()">Cancelar</button>
        </div>
      </div>
    </p-dialog>
    </form>
