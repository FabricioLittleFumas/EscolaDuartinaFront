<p-dialog 
header="Excluir" 
[(visible)]="displayModals" 
[modal]="true"
[dismissableMask]="true"
[closable]="true"
[style]="{ width: '450px' }"
(onHide)="closeDialog()">
<svg data-p-icon="user" [size]="80"></svg>
<p>RM: {{aluno.rm ?? '—'}}</p>
<p>Nome: {{aluno.nome}}</p>
<p>Data de nascimento: {{aluno.data_nascimento| date:'dd/MM/yyyy'}}</p>
<p>Unidade de ensino: {{aluno.unidade}}</p>
<div class="flx">
    <button pButton type="button" (click)="confirmExclude()">Confirmar</button>
    <button pButton severity="secondary" type="button" (click)="closeDialog()">Cancelar</button>

</div>
  
    </p-dialog>
