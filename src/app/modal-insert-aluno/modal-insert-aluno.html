<form [formGroup]="alunoForm" (ngSubmit)="onSubmit()" class="mt-4">
<p-dialog 
header="Inserir Aluno" 
[(visible)]="displayModal" 
[modal]="true"
[dismissableMask]="true"
[closable]="true"
[style]="{ width: '450px' }"
(onHide)="closeDialog($event)">

      <div class="p-fluid">
        <div>
          <label for="rm" class="font-bold lbInfo">RM</label>
          <input id="rm" class="ipInfo" type="number" min="1" step="1" pInputText formControlName="rm" placeholder="Digite o RM do aluno" />
        </div>
        <div>
          <label for="nome" class="font-bold lbInfo">Nome</label>
          <input id="nome" class="ipInfo" type="nome" pInputText 
          [(ngModel)]="nome" placeholder="Digite seu nome" formControlName="nome" />
        </div>
        
        <div>
          <label for="data_nascimento" class="font-bold lbInfo">Data de nascimento</label>
         
  <p-datepicker inputId="data_nascimento" placeholder="Digite a data de nascimento" panelStyleClass="calendario-compacto" [(ngModel)]="date" formControlName="data_nascimento" dateFormat="dd/mm/yy"></p-datepicker>
        </div>

        <div>
          <label for="unidade" class="font-bold lbInfo">Unidade</label>
          <select id="unidade" class="ipInfo" formControlName="unidade">
            <option value="" disabled>Selecione a unidade</option>
            <option value="MUNICIPAL">MUNICIPAL</option>
            <option value="ESTADUAL">ESTADUAL</option>
          </select>
        </div>
        <div class="flx">
            <button pButton type="submit">Inserir</button>
            <button pButton type="button" severity="secondary" (click)="closeDialog($event)">Cancelar</button>

        </div>
      </div>
    </p-dialog>
    </form>
