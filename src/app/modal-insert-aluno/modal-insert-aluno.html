<form [formGroup]="alunoForm" (ngSubmit)="onSubmit()" class="mt-4">
<p-dialog 
header="Inserir Aluno" 
[(visible)]="displayModal" 
[modal]="true"
[dismissableMask]="true"
[closable]="true"
[style]="{ width: '450px' }"
(onHide)="closeDialog($event)">

      <div class="p-fluid">
        <div>
          <label for="nome" class="font-bold lbInfo">Nome</label>
          <input id="nome" class="ipInfo" type="nome" pInputText 
          [(ngModel)]="nome" placeholder="Digite seu nome" formControlName="nome" />
        </div>
        
        <div>
          <label for="DtNasc" class="font-bold lbInfo">Data de nascimento</label>
         
  <p-datepicker  placeholder="Digite a data de sua matricula" panelStyleClass="calendario-compacto" [(ngModel)]="date" formControlName="data_saida" dateFormat="dd/mm/yy"></p-datepicker>
        </div>

        <div>
          <label for="unidade" class="font-bold lbInfo">Unidade</label>
          <input id="unidade" class="ipInfo" type="text" pInputText 
          [(ngModel)]="unidade" placeholder="Digite sua unidade Escolar" formControlName="unidade" />
         
        </div>
        <div class="flx">
            <button pButton severity="secondary" type="submit">Inserir</button>
            <button pButton severity="secondary" (click)="closeDialog($event)">Cancelar</button>

        </div>
      </div>
    </p-dialog>
    </form>
