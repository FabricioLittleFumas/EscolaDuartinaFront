<p-dialog 
header="Inserir Aluno" 
[(visible)]="displayModal" 
[modal]="true"
[dismissableMask]="true"
[closable]="true"
[style]="{ width: '450px' }"
(onHide)="closeDialog()">

      <div class="p-fluid">
        <div>
          <label for="nome" class="font-bold lbInfo">Nome</label>
          <input id="nome" class="ipInfo" type="nome" pInputText 
          [(ngModel)]="nome" placeholder="Digite seu nome" />
        </div>
        
        <div>
          <label for="DtNasc" class="font-bold lbInfo">Data de nascimento</label>
          <input id="DtNasc" class="ipInfo" type="password" pInputText 
          [(ngModel)]="dtNascimento" placeholder="Data de nascimento" />
        
        </div>

        <div>
          <label for="unidade" class="font-bold lbInfo">Unidade</label>
          <input id="unidade" class="ipInfo" type="password" pInputText 
          [(ngModel)]="unidade" placeholder="Digite sua unidade Escolar" />
         
        </div>
        <div class="flx">
            <button pButton severity="secondary" type="submit">Inserir</button>
            <button pButton severity="secondary" type="submit" (click)="closeDialog()">Cancelar</button>

        </div>
      </div>
    </p-dialog>
